# queries.gql
# Arquivo de Consultas no Firebase para operações de Leitura - FinUp App
# ==============================================================================

# 1. Listar todas as contas de um usuário
query ListarContasPorUsuario @auth(level: USER) {
  contas(where: { usuarioId: { eq_expr: "auth.uid" } }) {
    id
    nomeConta
    tipoConta
    saldoAtual
    limiteTotal
    instituicao {
      nome
      corHex
    }
  }
}

# 2. Listar transações de uma conta
query ListarTransacoesPorConta @auth(level: USER) {
  transacaos(
    where: { criadoPorUsuarioId: { eq_expr: "auth.uid" } },
    orderBy: [{ dataTransacao: DESC }]
  ) {
    id
    descricao
    valor
    dataTransacao
    status
    tipoMovimentacao
    categoria {
      nome
      icone
    }
    criadoPorUsuario {
      nome
    }
  }
}

# 3. Consultar convite pelo token para exibir os dados antes do aceite.
query ConsultarConviteAcesso($token: String!) @auth(
  level: USER,
  insecureReason: "The token lookup is constrained by the invitation token and the returned email is checked against the authenticated email."
) {
  conviteAcessos(where: { token: { eq: $token } }) {
    id
    token
    usuarioPrincipalId
    emailConvidado @check(
      expr: "this == auth.token.email",
      message: "Este convite não pertence ao e-mail autenticado."
    )
    statusConvite
    dataExpiracao
    dataAceite
  }
}

# 4. Consultar o perfil autenticado para aplicar regras de interface.
query MeuUsuario @auth(level: USER) {
  usuarios(where: { id: { eq_expr: "auth.uid" } }) {
    id
    nome
    email
    papel
    usuarioPaiId
  }
}
