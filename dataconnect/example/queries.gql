# queries.gql
# Arquivo de Consultas no Firebase para operações de Leitura - FinUp App
# ==============================================================================

# 1. Listar todas as contas cadastradas de um usuário
query ListarContasPorUsuario($usuarioId: String!) @auth(level: USER) {
  contas(where: { usuarioId: { eq: $usuarioId } }) {
    id
    nomeConta
    tipoConta
    saldoAtual
    limiteTotal
    instituicao {
      nome
      corHex
    }
  }
}

# 2. Listar o histórico de transações de uma conta
query ListarTransacoesPorConta($contaId: String!) @auth(level: USER) {
  # ATENÇÃO: O plural gerado é "transacaos" (com 's' no final)
  transacaos(
    where: { contaId: { eq: $contaId } },
    orderBy: [{ dataTransacao: DESC }]
  ) {
    id
    descricao
    valor
    dataTransacao
    status
    tipoMovimentacao
    categoria {
      nome
      icone
    }
    criadoPorUsuario {
      nome
    }
  }
}
