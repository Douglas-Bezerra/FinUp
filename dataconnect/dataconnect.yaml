# dataconnect.yaml
# Arquivo de Configuração do Data Connect no Firebase
#=====================================================

specVersion: "v1"
serviceId: "finup"
location: "us-central1"
schema:
  source: "./schema"
  schemaValidation: "COMPATIBLE" # <--- Garanta que esta linha está presente
  datasource:
    postgresql:
      database: "fdcdb"
      cloudSql:
        instanceId: "finup-fdc"
connectorDirs:
  - "./example"